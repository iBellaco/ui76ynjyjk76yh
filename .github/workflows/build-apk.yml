name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # AGP 9.1.1 and Gradle 9.3.1 require JDK 21+
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Prepare environment, keystore and configs
      run: |
        # Generate .env if missing
        if [ ! -f .env ]; then
          cp .env.example .env 2>/dev/null || touch .env
        fi

        # Generate debug.keystore if missing (required by app/build.gradle.kts signingConfigs)
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

        # Generate dummy google-services.json if missing to satisfy Google Services plugin
        if [ ! -f app/google-services.json ]; then
          cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789012",
            "project_id": "kwgt-chatgpt"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef012345",
                "android_client_info": {
                  "package_name": "com.aistudio.kwgtchatgpt.kwgtwgt"
                }
              },
              "api_key": [{"current_key": "dummy_key"}]
            }
          ],
          "configuration_version": "1"
        }
        EOF
        fi

        # Ensure executable permissions on gradlew
        chmod +x gradlew || true

    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
        cp app/build/outputs/apk/debug/*.apk KWGT-ChatGPT-v1.0.1.apk

    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache

    # Option 1: Saved as GitHub Workflow Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KWGT-ChatGPT-v1.0.1-APK
        path: KWGT-ChatGPT-v1.0.1.apk
        if-no-files-found: error

    # Option 2: Direct download via GitHub Releases (Runs on every push)
    - name: Publish APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "release-v1.0.1-build-${{ github.run_number }}"
        name: "KWGT ChatGPT Monitor v1.0.1 (Build #${{ github.run_number }})"
        body: |
          ### 📱 KWGT ChatGPT Monitor v1.0.1 APK

          Instalador directo para Android:
          - **Archivo**: `KWGT-ChatGPT-v1.0.1.apk`
          - **Versión**: 1.0.1 (Patch 1)
          - **Compilación**: Build #${{ github.run_number }}
          - Compatible con Android 7.0 a Android 16.
        files: KWGT-ChatGPT-v1.0.1.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
